name: Generate SBOM and Scan for Vulnerabilities

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sbom-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Create SBOM directory
        run: mkdir -p sbom

      - name: Build and scan services
        run: |
          # Find all Dockerfiles
          find src -name Dockerfile -type f | while read dockerfile; do
            service_dir=$(dirname "$dockerfile")
            service=$(basename "$service_dir")

            echo "Processing $service from $service_dir..."

            # Build image with cache
            docker buildx build \
              --cache-from type=local,src=/tmp/.buildx-cache \
              --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
              -t $service:latest \
              --load \
              "$service_dir"

            # Generate SBOM
            syft $service:latest -o json > sbom/${service}-sbom.json

            # Scan for vulnerabilities
            grype $service:latest -o json > sbom/${service}-vulnerabilities.json

            # Generate human-readable report
            grype $service:latest -o table > sbom/${service}-vulnerabilities.txt
          done

          # Move cache to avoid unbounded growth
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Create labels if they don't exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "security" --color "d73a4a" --force || true
          gh label create "critical" --color "b60205" --force || true
          gh label create "vulnerability" --color "d93f0b" --force || true

      - name: Parse and create issues for critical vulnerabilities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for vuln_file in sbom/*-vulnerabilities.json; do
            service=$(basename "$vuln_file" -vulnerabilities.json)

            # Extract critical vulnerabilities
            jq -r '.matches[] | select(.vulnerability.severity == "Critical") |
              "\(.vulnerability.id)|\(.artifact.name)|\(.artifact.version)|\(.vulnerability.fix.versions[0] // "N/A")"' "$vuln_file" |
            while IFS='|' read -r cve package version fix; do
              if [ -n "$cve" ]; then
                # Create GitHub issue with labels
                gh issue create \
                  --title "Critical Vulnerability in $service: $cve" \
                  --body "**Service:** $service
                  **Package:** $package
                  **Current Version:** $version
                  **Fixed Version:** $fix
                  **CVE:** $cve

                  Please review and update the affected package to mitigate this critical vulnerability.

                  ---
                *Auto-generated by SBOM vulnerability scan*" \
                  --label "security,critical,vulnerability" || echo "Issue may already exist or failed to create"
              fi
            done
          done

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reports
          path: sbom/

      - name: Commit SBOM files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sbom/
          git diff --staged --quiet || git commit -m "Update SBOM and vulnerability reports"
          git push
